name: Deploy site (bridge-craftwork.com)

on:
  push:
    branches: [main]
    # Docs-only pushes don't change what gets served. A push that also touches
    # a build input still deploys — paths-ignore skips only when EVERY changed
    # file matches. Do NOT add `site/**` or `src/**` here; they are the build.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run; a newer push cancels the older, so the deployed Worker is
# always the newest commit rather than whichever run happened to finish last.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Mapped to an env var so the steps can be conditioned on the secret's
      # presence — secrets can't be referenced directly in `if:`. Self-gating:
      # this workflow is a no-op until CLOUDFLARE_API_TOKEN exists, so it is
      # safe to merge before the Cloudflare side is set up.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: env.CF_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wrangler
        if: env.CF_API_TOKEN != ''
        run: npm ci

      # Deploy with the repo's pinned wrangler (devDependency, ^4). Deliberately
      # NOT cloudflare/wrangler-action: left unpinned it falls back to wrangler
      # 3.90.0, which predates Workers Static Assets and cannot deploy this
      # config. Bridge-Classroom hit that and moved to `npx wrangler` for the
      # same reason. wrangler reads the credentials from these env vars.
      - name: Deploy Worker
        if: env.CF_API_TOKEN != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
